name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

          # macOS Intel — cross-compiled from the macos-latest (ARM) runner
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64

          # Linux x86_64 — statically linked (musl), no glibc dependency
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            apt_packages: musl-tools

          # Linux aarch64 — statically linked (musl) via cargo-zigbuild
          # Avoids glibc version mismatch on Raspberry Pi OS and older distros
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            label: linux-arm64
            use_zigbuild: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools (apt)
        if: ${{ matrix.apt_packages != '' && matrix.apt_packages != null }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install Zig and cargo-zigbuild (for musl aarch64)
        if: ${{ matrix.use_zigbuild == true }}
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build
        run: |
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/tuimenu tuimenu-${{ matrix.label }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
          || true

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} tuimenu-${{ matrix.label }} --clobber
