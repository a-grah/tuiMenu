name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

          # macOS Intel — cross-compiled from the macos-latest (ARM) runner
          # avoids scarce/deprecated macos-13 Intel runners
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64

          # Linux x86_64 — statically linked (musl) for maximum portability
          # Works on Amazon Linux, Ubuntu, Debian, etc. without glibc version concerns.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            apt_packages: musl-tools

          # Linux aarch64 — Raspberry Pi 4, AWS Graviton, and other 64-bit ARM Linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            apt_packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: ${{ matrix.apt_packages != '' && matrix.apt_packages != null }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Configure cross-linker
        if: ${{ matrix.linker != '' && matrix.linker != null }}
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/tuimenu tuimenu-${{ matrix.label }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
          || true

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} tuimenu-${{ matrix.label }} --clobber
