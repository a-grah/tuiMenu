name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64

          # Linux x86_64 — statically linked (musl) for maximum portability
          # Works on Amazon Linux, Ubuntu, Debian, etc. without glibc version concerns.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64
            apt_packages: musl-tools

          # Linux aarch64 — Raspberry Pi 4 (64-bit OS)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64-rpi4
            apt_packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compilation tools
        if: matrix.apt_packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Configure cross-linker
        if: matrix.linker != ''
        run: |
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/tuimenu tuimenu-${{ matrix.label }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: tuimenu-${{ matrix.label }}
