[package]
name = "tuimenu"
version = "0.1.0"
edition = "2021"
description = "A configurable command-menu TUI with vi-style keys and status widgets"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sysinfo = "0.33"
serde_json = "1"
anyhow = "1"

[[bin]]
name = "tuimenu"
path = "src/main.rs"
